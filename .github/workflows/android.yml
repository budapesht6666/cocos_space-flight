# Native Android app (PLATFORMS.md "Android"): an APK anyone can download and install, no store.
# Cocos Creator has no Linux editor, so this runs on macOS like the iOS build and shares its cached
# editor. The release key comes from the repository's secrets: every build is signed by the same
# key, or phones refuse to update the app. The APK goes to the run's artifacts and the
# `android-latest` prerelease (the game page links there).

name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'build-configs/android.json'
      - 'tools/ci/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-build
  cancel-in-progress: true

permissions:
  contents: write

env:
  CREATOR_VERSION: '3.8.8'
  # From https://creator-api.cocos.com/api/cocoshub/editor_version_list (the "darwin" link).
  CREATOR_URL: 'https://download.cocos.com/CocosCreator/v3.8.8/CocosCreator-v3.8.8-mac-121518.zip'

jobs:
  android:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check the signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error title=signing::Secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD are not set (PLATFORMS.md, Android)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Restore Cocos Creator
        id: creator-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/cocos/${{ env.CREATOR_VERSION }}
          key: cocos-creator-mac-${{ env.CREATOR_VERSION }}

      - name: Download Cocos Creator
        if: steps.creator-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/cocos/$CREATOR_VERSION
          curl -fL --retry 3 -o "$RUNNER_TEMP/creator.zip" "$CREATOR_URL"
          ditto -x -k "$RUNNER_TEMP/creator.zip" ~/cocos/$CREATOR_VERSION
          rm "$RUNNER_TEMP/creator.zip"

      - name: Save Cocos Creator
        if: steps.creator-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/cocos/${{ env.CREATOR_VERSION }}
          key: cocos-creator-mac-${{ env.CREATOR_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate the tools
        run: |
          APP="$(find ~/cocos/$CREATOR_VERSION -maxdepth 2 -name 'CocosCreator.app' | head -n 1)"
          test -n "$APP"
          xattr -cr "$APP" || true
          echo "CREATOR_APP=$APP" >> "$GITHUB_ENV"
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          test -n "$NDK"
          echo "NDK_PATH=$NDK" >> "$GITHUB_ENV"
          echo "SDK: $ANDROID_HOME"; ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | tr '\n' ' '; echo
          echo "NDK: $NDK"; java -version 2>&1 | head -n 1

      - name: Restore imported assets
        id: library-cache
        uses: actions/cache/restore@v4
        with:
          path: game/library
          key: android-library-${{ hashFiles('game/assets/**/*.meta') }}
          restore-keys: android-library-

      - name: Build
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
          export VERSION_CODE="$GITHUB_RUN_NUMBER"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          bash tools/ci/build-android.sh "$CREATOR_APP" "$RUNNER_TEMP/out"
          rm -f "$KEYSTORE_FILE"

      - name: Save imported assets
        if: always() && steps.library-cache.outputs.cache-hit != 'true' && hashFiles('game/library/**') != ''
        uses: actions/cache/save@v4
        with:
          path: game/library
          key: android-library-${{ hashFiles('game/assets/**/*.meta') }}

      - name: Report the failure
        # Not when it failed before the checkout (no scripts yet).
        if: failure() && hashFiles('tools/ci/annotate-tail.sh') != ''
        run: |
          bash tools/ci/annotate-tail.sh "$RUNNER_TEMP/out/gradle.log" gradle 60
          bash tools/ci/annotate-tail.sh "$RUNNER_TEMP/out/cocos.log" cocos 60

      - uses: actions/upload-artifact@v4
        with:
          name: SpaceFlight-apk
          path: ${{ runner.temp }}/out/SpaceFlight.apk
          if-no-files-found: error

      - name: Publish the android-latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest "$RUNNER_TEMP/out/SpaceFlight.apk" \
            --prerelease --target "$GITHUB_SHA" --title "Android build" \
            --notes "Build of ${GITHUB_SHA::7}: download SpaceFlight.apk on the phone and install it (docs/PLATFORMS.md, \"Android\")."
